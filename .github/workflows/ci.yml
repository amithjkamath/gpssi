name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff mypy

            - name: Lint with Ruff
              run: ruff check src/ tests/

            - name: Check formatting with Ruff
              run: ruff format --check src/ tests/

            - name: Type check with mypy
              run: |
                  pip install numpy scipy
                  mypy src/gpssi --ignore-missing-imports

    test:
        name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Run tests
              run: pytest tests/ -v --ignore=tests/test_benchmarks.py

            - name: Run tests with coverage
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
              run: pytest tests/ -v --cov=src/gpssi --cov-report=xml --ignore=tests/test_benchmarks.py

            - name: Upload coverage
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.xml
                  fail_ci_if_error: false

    benchmark:
        name: Benchmarks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Run benchmarks
              run: pytest tests/test_benchmarks.py -v --benchmark-only --benchmark-json=benchmark.json

            - name: Store benchmark result
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results
                  path: benchmark.json

    build:
        name: Build Package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install build twine

            - name: Build package
              run: python -m build

            - name: Check package
              run: twine check dist/*

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
